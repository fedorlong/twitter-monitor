name: Twitter Monitor

on:
  schedule:
    - cron: "*/5 * * * *"  # 每 5 分钟运行一次
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
    
    # 检出代码
    - name: Checkout code
      uses: actions/checkout@v2

    # 设置 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'

    # 安装依赖
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 下载 last_tweet.json（如果存在）
    - name: Download last_tweet.json
      uses: actions/download-artifact@v2
      with:
        name: last_tweet
        path: ./  # 下载到当前目录

    # 运行监控脚本
    - name: Run monitor script
      run: python monitor.py

    # 上传 last_tweet.json 文件
    - name: Upload last_tweet.json
      if: success()  # 如果脚本执行成功，则上传文件
      uses: actions/upload-artifact@v2
      with:
        name: last_tweet
        path: last_tweet.json
